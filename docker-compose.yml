services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "app"
    # restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    networks:
      - app-network
    volumes:
      - .:/app

    command: [
      "sh", "-c",
      "uvicorn app.presentation ... --reload --host ${WEBAPP_WEBHOOK_HOST}
      --port ${WEBAPP_WEBHOOK_PORT} --no-access-log"
    ]

  db:
    image: postgres:18.3
    container_name: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - app-network
    volumes:
      - redis-data:/data

  queue_worker:
    build: .
    container_name: "queue_worker"
    volumes:
      - .:/app
    env_file:
      - .env
    command: taskiq worker app ...
    networks:
      - app-network

  scheduler:
    build: .
    container_name: "scheduler"
    volumes:
      - .:/app
    command: taskiq scheduler app ...
    env_file:
      - .env
    networks:
      - app-network

volumes:
  dbdata6:
  redis-data:


networks:
  app-network:
    external: true